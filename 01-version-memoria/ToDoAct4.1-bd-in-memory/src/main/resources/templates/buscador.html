<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Task Search</title>
</head>

<body>
	<h1>Task search</h1>
	<form method="post" th:action="@{/cercar}">
		<p><strong>Search criteria:</strong></p>
		<label>User:
			<input type="text" name="usuario" th:value="${usuario}" placeholder="Enter a user..." />
		</label><br /><br />
		<label>Due date:
			<input type="date" name="fechaVencimiento" th:value="${fechaVencimiento != null ?
                   #temporals.format(fechaVencimiento,'yyyy-MM-dd') : ''}" />
		</label>
		<label>Done:
			<input type="checkbox" name="realizada" value="true" th:checked="${realizada}" />
		</label>
		<button type="submit">Search</button>
		<a th:href="@{/cercar}"><button type="button">Clear</button></a>
	</form>
	<div th:if="${tareas != null}">
		<p><strong>Search results</strong></p>
		<table border="1" cellpadding="6">
			<thead>
				<tr>
					<th>Code</th>
					<th>User</th>
					<th>Description</th>
					<th>Due</th>
					<th>Done</th>
					<th>Category</th>
					<th>Actions</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="t : ${tareas}">
					<td th:text="${t.codigo}"></td>
					<td th:text="${t.nombre}"></td>
					<td th:text="${t.descripcion}"></td>
					<td th:text="${#temporals.format(t.vencimientoEn, 'dd-MM-yyyy HH:mm')}"></td>
					<td th:text="${t.realizada ? 'Yes' : 'No'}"></td>
					<td th:text="${t.categoria != null ? t.categoria : '-'}"></td>
					<td>
						<a th:href="@{/esborrar(code=${t.codigo})}">Delete</a> |
						<a th:href="@{/tarea(code=${t.codigo})}">Details</a>
					</td>
				</tr>
			</tbody>
		</table>
	</div>

	<p>
		<a th:href="@{/tarea-form}">Add Task</a> |
		<a th:href="@{/}">Back to main menu</a>
	</p>
</body>

</html>
