<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Task Details</title>
</head>

<body>
	<h1 th:text="'Task Details ' + ${tarea.codigo}"></h1>
	<ul>
		<li><strong>User:</strong>
			<span th:text="${tarea.nombre}"></span>
		</li>
		<li><strong>Description:</strong>
			<span th:text="${tarea.descripcion}"></span>
		</li>
		<li><strong>Due:</strong>
			<span th:text="${#temporals.format(tarea.vencimientoEn, 'dd-MM-yyyy HH:mm')}"></span>
		</li>
		<li><strong>Done:</strong>
			<span th:text="${tarea.realizada ? 'Yes' : 'No'}"></span>
		</li>
		<li><strong>Priority:</strong>
			<span th:text="${tarea.prioridad}"></span>
		</li>
		<li><strong>Category:</strong>
			<span th:text="${tarea.categoria != null ? tarea.categoria : '-'}"></span>
		</li>
	</ul>
	<p>
		<a th:href="@{/cercar}">Go to search</a> |
		<a th:href="@{/tasques}">See task list</a> |
		<a th:href="@{/}">Go to main menu</a> |
		<a th:href="@{/esborrar(code=${tarea.codigo})}">Delete task</a>
	</p>
</body>

</html>
