<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Add New Task</title>
</head>

<body>
	<h1>Add New Task</h1>

	<div th:if="${errorMsg}" style="color:red;">
		<p th:text="${errorMsg}"></p>
	</div>

	<form action="/tarea-add" method="post">

		<label>User:
			<input name="user" type="text" required />
		</label><br /><br />

		<label>Description:
			<input name="description" type="text" required />
		</label><br /><br />

		<label>Priority:
			<select name="priority" required>
				<option th:each="p : ${prioritats}" th:value="${p}" th:text="${p}"></option>
			</select>
		</label><br /><br />

		<label>
			<input name="done" type="checkbox" value="true" />
			Done
		</label><br /><br />

		<label>Due date:
			<input name="endingDate" type="date" required />
		</label><br /><br />

		<label>Due time:
			<input name="endingTime" type="time" required />
		</label><br /><br />

		<label>Category:
			<select name="categoria">
				<option value="">-- No category --</option>
				<option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
			</select>
		</label><br /><br />

		<input type="submit" value="Add" />
	</form>

	<p><a th:href="@{/}">Back to main menu</a></p>
</body>

</html>
